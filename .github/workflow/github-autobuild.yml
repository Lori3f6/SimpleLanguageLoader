name: AutoBuilder
run-name: Auto build on ${{github.ref_type}} ${{github.ref_name}}, task ${{github.run_number}}
on: [push]
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: setup jdk 21
        uses: actions/setup-java@v4.2.2
        with:
          distribution: 'oracle'
          java-version: '21'
      - name: build project with maven
        run: mvn package
      - name: upload artifacts
        uses: actions/upload-artifact@v4.3.6
        with:
          name: artifacts
          path: target/*.jar
